[package]
name = "s-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "s-compositor"

[[bin]]
name = "s-compositor"
path = "src/main.rs"

[dependencies]
s-compositor-wayland.workspace = true
s-compositor-shell.workspace = true
s-compositor-render.workspace = true
s-compositor-tray.workspace = true
slint.workspace = true
glow.workspace = true
chrono.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
zbus = "5"
async-channel = "2"
# A Tokio runtime is entered on the main thread: `system-tray` enables zbus's
# `tokio` feature for the whole binary, so Slint's winit backend (which uses
# zbus to watch the XDG colour scheme) calls `tokio::spawn_blocking` and would
# otherwise panic with "no reactor running" on the Slint thread.
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
libpulse-binding = "2.30.1"
image = "0.25.10"

[build-dependencies]
slint-build.workspace = true
