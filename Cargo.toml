[workspace]
resolver = "2"
members = [
    "crates/s-compositor",
    "crates/s-compositor-wayland",
    "crates/s-compositor-render",
    "crates/s-compositor-shell",
    "crates/s-compositor-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ogoffart/slick"

[workspace.dependencies]
s-compositor-wayland = { path = "crates/s-compositor-wayland" }
s-compositor-render = { path = "crates/s-compositor-render" }
s-compositor-shell = { path = "crates/s-compositor-shell" }
s-compositor-tray = { path = "crates/s-compositor-tray" }

slint = { version = "1.16", default-features = false, features = [
    "compat-1-2",
    "std",
    "renderer-skia-opengl",
    "backend-winit",
] }
slint-build = "1.16"

smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "backend_egl",
] }

calloop = "0.14"
glow = "0.17"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
